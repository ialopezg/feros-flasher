[package]
name = "feros-flasher"
version = "0.1.0"
edition = "2021"
description = "Safe physical-media installation and recovery for FeROS"
build = "build.rs"
publish = false

[[bin]]
name = "flasher"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
plist = "1.7"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2.0"
toml = "1.1.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
