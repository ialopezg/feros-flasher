[package]
name = "feros-flasher"
version = "0.2.0"
edition = "2021"
authors = ["FeROS Project"]
description = "Safe physical-media installation and recovery for FeROS"
build = "build.rs"
publish = false

[[bin]]
name = "flasher"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.5", features = ["derive"] }
plist = "1.7"
reqwest = { version = "0.13.5", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0"
toml = "1.1.6"
url = "2.5.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
