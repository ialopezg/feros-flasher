name: Release candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - name: Validate tag syntax
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve one commit for all builds
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: linux-x86_64
          - runner: macos-15
            artifact: darwin-aarch64
          - runner: windows-2025
            artifact: windows-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and build native candidate
        uses: ./ci
        with:
          manifest-path: Cargo.toml
      - name: Package tagged candidate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: python scripts/package.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify assets and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$SOURCE_COMMIT"
          for platform in darwin-aarch64 linux-x86_64 windows-x86_64; do
            archive="feros-flasher-$RELEASE_TAG-$platform.tar.gz"
            test -f "dist/$archive"
            test -f "dist/$archive.sha256"
            (cd dist && sha256sum -c "$archive.sha256")
          done
          python3 - <<'PYNOTES'
          import os
          from pathlib import Path
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          text = Path("CHANGELOG.md").read_text()
          heading = "## [" + version + "] - "
          sections = [heading + chunk for chunk in text.split(heading)[1:]]
          if len(sections) != 1:
              raise SystemExit("Expected exactly one matching CHANGELOG section")
          section = sections[0].split("\n## [", 1)[0].strip()
          notes = "# FeROS Flasher " + os.environ["RELEASE_TAG"] + "\n\n"
          notes += "Source commit: " + os.environ["SOURCE_COMMIT"] + "\n\n" + section
          notes += "\n\nNative CLI candidates: macOS ARM64, Linux x86_64, Windows x86_64."
          notes += "\nPhysical-media operations: macOS only; Linux/Windows are not implemented."
          notes += "\nRepository registration requires network access and does not fetch target catalogs."
          notes += "\nUnsigned binaries; macOS is not notarized. See BUILD-INFO.json and THIRD_PARTY.md."
          notes += "\nMaintainer review and detailed release notes are required before publication.\n"
          Path("release-notes.md").write_text(notes)
          PYNOTES
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 \
            --verify-tag --draft --title "FeROS Flasher $RELEASE_TAG" \
            --notes-file release-notes.md
